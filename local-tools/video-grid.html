<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Video Grid</title>
<style>
  :root {
    --bg: #f5f4f8; --panel: #ffffff; --fg: #1d1b26; --muted: #6b6878;
    --line: #dcd9e4; --accent: #5b3fd1; --accent-fg: #ffffff; --tile: #0f0e14;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121118; --panel: #1b1a23; --fg: #ece9f5; --muted: #9a96aa;
      --line: #2e2c3a; --accent: #8c74ff; --accent-fg: #121118; --tile: #000; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 20px max(16px, env(safe-area-inset-left)) 40px max(16px, env(safe-area-inset-right)); }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 16px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px;
    display: grid; gap: 10px; }
  textarea { width: 100%; min-height: 150px; resize: vertical; padding: 10px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--bg); color: var(--fg);
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button, select { font: inherit; padding: 7px 12px; border-radius: 7px; border: 1px solid var(--line);
    background: var(--panel); color: var(--fg); cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
  button:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .status { color: var(--muted); margin-left: auto; font-variant-numeric: tabular-nums; }
  .err { color: #d0453a; }
  .grid { display: grid; gap: 10px; margin-top: 16px; grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr)); }
  @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }
  .tile { background: var(--tile); border-radius: 8px; overflow: hidden; position: relative; }
  .tile iframe { display: block; width: 100%; aspect-ratio: 16 / 9; border: 0; }
  .tile .bar { display: flex; justify-content: space-between; gap: 8px; padding: 6px 10px;
    background: var(--panel); border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
  .tile .bar a { color: var(--accent); text-decoration: none; }
  .tile .bar button { padding: 2px 8px; font-size: 12px; }
  .tile .player { width: 100%; aspect-ratio: 16 / 9; }
  .tile .player iframe { width: 100%; height: 100%; }
  .tile .sync { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 6px 10px;
    background: var(--panel); font-size: 12px; color: var(--muted); }
  .tile .sync button { padding: 2px 7px; font-size: 12px; }
  .tile .sync input { width: 72px; padding: 2px 6px; font: 12px ui-monospace, Menlo, monospace;
    border: 1px solid var(--line); border-radius: 5px; background: var(--bg); color: var(--fg); }
  .share { display: flex; gap: 8px; }
  .share input { flex: 1; min-width: 0; padding: 7px 10px; border-radius: 7px; border: 1px solid var(--line);
    background: var(--bg); color: var(--fg); font: 12px ui-monospace, Menlo, monospace; }
  .help { color: var(--muted); font-size: 12px; margin: 0; }
  .help code { font-size: 12px; }
</style>
</head>
<body>
  <h1>Video Grid</h1>
  <p class="sub">Paste up to 10 YouTube links, one per line. They all load and play side by side in this browser.</p>

  <div class="panel">
    <textarea id="links" spellcheck="false" placeholder="https://www.youtube.com/watch?v=...&#10;https://youtu.be/... 1:23.5&#10;https://www.youtube.com/watch?v=...&amp;t=90"></textarea>
    <p class="help">Optional start time after a link: <code>1:23.5</code>, <code>83.5</code> or a <code>t=</code> in the URL.</p>
    <div class="row">
      <button class="primary" id="load">Load videos</button>
      <button id="syncPlay" title="Jump every video to its start time and play together">Sync play</button>
      <button id="playAll">Play all</button>
      <button id="pauseAll">Pause all</button>
      <button id="muteAll">Mute all</button>
      <button id="unmuteAll">Unmute all</button>
      <label for="cols">Columns</label>
      <select id="cols"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option></select>
      <span class="status" id="status"></span>
    </div>
    <div class="share">
      <input id="shareUrl" readonly placeholder="Load videos, then make a link that reopens this exact set">
      <button id="share">Copy share link</button>
    </div>
  </div>

  <div class="grid" id="grid"></div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
const MAX = 10;
const $ = id => document.getElementById(id);
const grid = $('grid'), status = $('status'), links = $('links'), cols = $('cols');
let tiles = []; // { id, start, player, input }
let apiReady = false, pending = false;
window.onYouTubeIframeAPIReady = () => { apiReady = true; if (pending) load(); };

function parseTime(t) {
  if (t == null || t === '') return 0;
  t = String(t).trim();
  let m = t.match(/^(?:(\d+)h)?(?:(\d+)m)?(?:([\d.]+)s?)?$/);
  if (m && /[hms]/.test(t)) return (+m[1] || 0) * 3600 + (+m[2] || 0) * 60 + (+m[3] || 0);
  const parts = t.split(':').map(Number);
  if (parts.some(isNaN)) return 0;
  return parts.reduce((a, b) => a * 60 + b, 0);
}
function fmt(sec) {
  sec = Math.max(0, Math.round(sec * 10) / 10);
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = (sec % 60).toFixed(1).padStart(4, '0');
  return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + s;
}

function parseLine(raw) {
  const [urlPart, timePart] = raw.trim().split(/\s+/);
  if (!urlPart) return null;
  let id = null, start = 0;
  if (/^[\w-]{11}$/.test(urlPart)) id = urlPart;
  else try {
    const u = new URL(urlPart.startsWith('http') ? urlPart : 'https://' + urlPart);
    const host = u.hostname.replace(/^www\.|^m\./, '');
    if (host === 'youtu.be') id = u.pathname.slice(1, 12);
    else if (host.endsWith('youtube.com') || host === 'youtube-nocookie.com') {
      id = u.searchParams.get('v') || (u.pathname.match(/^\/(?:embed|shorts|live|v)\/([\w-]{11})/) || [])[1];
    }
    const t = u.searchParams.get('t') || u.searchParams.get('start');
    if (t) start = parseTime(t);
  } catch (e) {}
  if (!id || !/^[\w-]{11}$/.test(id)) return null;
  if (timePart) start = parseTime(timePart);
  return { id, start };
}

function load() {
  if (!apiReady) { pending = true; status.textContent = 'Loading YouTube player...'; return; }
  pending = false;
  const lines = links.value.split('\n').map(l => l.trim()).filter(Boolean);
  const items = [], bad = [];
  lines.forEach(l => { const it = parseLine(l); it ? items.push(it) : bad.push(l); });
  const used = items.slice(0, MAX);
  tiles.forEach(t => { try { t.player.destroy(); } catch (e) {} });
  grid.innerHTML = '';
  tiles = used.map((it, i) => {
    const tile = document.createElement('div');
    tile.className = 'tile';
    tile.innerHTML = `<div class="player"><div></div></div>
      <div class="sync">Start <input type="text" id="start-${i}" aria-label="Start time for video ${i + 1}" value="${fmt(it.start)}">
        <button type="button" data-n="-1">-1s</button><button type="button" data-n="-0.1">-0.1</button>
        <button type="button" data-n="0.1">+0.1</button><button type="button" data-n="1">+1s</button>
        <button type="button" data-here>Set to now</button></div>
      <div class="bar"><span>#${i + 1} · <a href="https://www.youtube.com/watch?v=${it.id}" target="_blank" rel="noopener">${it.id}</a></span>
      <button type="button" data-solo>Hear this one</button></div>`;
    grid.appendChild(tile);
    const t = { id: it.id, start: it.start, input: tile.querySelector('input') };
    t.player = new YT.Player(tile.querySelector('.player > div'), {
      videoId: it.id,
      playerVars: { autoplay: 1, mute: 1, playsinline: 1, rel: 0, start: Math.floor(it.start), origin: location.origin },
      events: { onReady: e => { e.target.mute(); e.target.seekTo(t.start, true); e.target.playVideo(); } }
    });
    const setStart = v => { t.start = Math.max(0, v); t.input.value = fmt(t.start); writeLinks(); t.player.seekTo?.(t.start, true); };
    t.input.onchange = () => setStart(parseTime(t.input.value));
    tile.querySelectorAll('[data-n]').forEach(b => b.onclick = () => setStart(t.start + +b.dataset.n));
    tile.querySelector('[data-here]').onclick = () => setStart(t.player.getCurrentTime?.() || 0);
    tile.querySelector('[data-solo]').onclick = () => tiles.forEach(o => o === t ? o.player.unMute?.() : o.player.mute?.());
    return t;
  });
  let msg = `${used.length} video${used.length === 1 ? '' : 's'} loaded`;
  if (items.length > MAX) msg += `, ${items.length - MAX} skipped (max ${MAX})`;
  status.textContent = msg;
  if (bad.length) status.innerHTML += ` · <span class="err">${bad.length} link${bad.length === 1 ? '' : 's'} not recognized</span>`;
  $('shareUrl').value = '';
  save();
}

// Keep the textarea in step with start times adjusted on the tiles
function writeLinks() {
  links.value = tiles.map(t => `https://youtu.be/${t.id}` + (t.start ? ' ' + fmt(t.start) : '')).join('\n');
  save();
}
function save() { try { localStorage.setItem('vg-links', links.value); } catch (e) {} }

const each = fn => tiles.forEach(t => { try { fn(t.player, t); } catch (e) {} });

async function syncPlay() {
  each(p => p.pauseVideo());
  each((p, t) => p.seekTo(t.start, true));
  // Wait until every player has buffered at its start point (max 8s), then start together
  const t0 = Date.now();
  status.textContent = 'Buffering...';
  while (Date.now() - t0 < 8000) {
    each(p => p.pauseVideo());
    const ready = tiles.every(t => { try { return Math.abs(t.player.getCurrentTime() - t.start) < 0.5 && t.player.getPlayerState() !== 3; } catch (e) { return false; } });
    if (ready) break;
    await new Promise(r => setTimeout(r, 250));
  }
  each((p, t) => p.seekTo(t.start, true));
  each(p => p.playVideo());
  status.textContent = `Synced ${tiles.length} video${tiles.length === 1 ? '' : 's'}`;
}

function shareLink() {
  if (!tiles.length) { status.textContent = 'Load videos first'; return; }
  const v = tiles.map(t => t.id + (t.start ? '~' + Math.round(t.start * 10) / 10 : '')).join(',');
  const url = `${location.origin}${location.pathname}#v=${v}&c=${cols.value}`;
  $('shareUrl').value = url;
  const done = () => { $('share').textContent = 'Copied'; setTimeout(() => $('share').textContent = 'Copy share link', 1500); };
  navigator.clipboard?.writeText(url).then(done, () => $('shareUrl').select()) ?? $('shareUrl').select();
}

function fromHash() {
  const h = new URLSearchParams(location.hash.slice(1));
  if (!h.get('v')) return false;
  links.value = h.get('v').split(',').map(s => {
    const [id, st] = s.split('~');
    return `https://youtu.be/${id}` + (st ? ' ' + fmt(+st) : '');
  }).join('\n');
  if (h.get('c')) cols.value = h.get('c');
  return true;
}

$('load').onclick = load;
$('syncPlay').onclick = syncPlay;
$('playAll').onclick = () => each(p => p.playVideo());
$('pauseAll').onclick = () => each(p => p.pauseVideo());
$('muteAll').onclick = () => each(p => p.mute());
$('unmuteAll').onclick = () => each(p => p.unMute());
$('share').onclick = shareLink;
cols.onchange = () => { grid.style.setProperty('--cols', cols.value);
  try { localStorage.setItem('vg-cols', cols.value); } catch (e) {} };

if (!fromHash()) {
  try {
    const saved = localStorage.getItem('vg-links'); if (saved) links.value = saved;
    const c = localStorage.getItem('vg-cols'); if (c) cols.value = c;
  } catch (e) {}
}
cols.onchange();
if (links.value.trim()) load();
</script>
</body>
</html>
